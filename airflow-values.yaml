dags:
  gitSync:
    enabled: true
    repo: "git@github.com:wittycodes/demostack.git"
    branch: main
    subPath: "workflows"
    sshKeySecret: airflow-ssh-secret
extraSecrets:
  airflow-ssh-secret:
    data: |
      gitSshKey: 
extraEnv: |
  - name: AIRFLOW__API__AUTH_BACKENDS
    value: airflow.api.auth.backend.basic_auth