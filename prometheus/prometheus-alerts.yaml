apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: custom-alerts
  namespace: prometheus
  labels:
    release: poc-stack
spec:
  groups:
  - name: Node Alerts
    rules:
    - alert: HighCPU
      expr: node_cpu_seconds_total:rate1m{mode="idle"} < 0.1
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: Instance {{ $labels.instance }} CPU usage over 90%
        description: CPU usage on instance {{ $labels.instance }} has been over 90% for the past 5 minutes.
    - alert: DiskSpaceLow
      expr: node_filesystem_avail_bytes / node_filesystem_size_bytes < 0.1
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: Disk space low on {{ $labels.instance }}
        description: The filesystem {{ $labels.device }} on node {{ $labels.instance }} is running low on space. Available disk space is below 10% of total size.


  - name: Kubernetes Alerts
    rules:
    - alert: PoC_InsufficientPods
      expr: kube_pod_status_phase{phase="Running"} < (kube_pod_status_phase{phase="Pending"} + kube_pod_status_phase{phase="Succeeded"} + kube_pod_status_phase{phase="Failed"} + kube_pod_status_phase{phase="Unknown"})
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: Insufficient number of running pods.
        description: The number of running pods is less than the sum of pending, succeeded, failed, and unknown pods.
    - alert: PoC_PodDiskUsageHigh
      expr: vector(1)
#      expr:  rate(container_fs_writes_bytes_total{namespace="monitoring"}[1m]) > 100
#      for: 5m
      labels:
        severity: critical
      annotations:
        summary: High disk usage on Pod {{ $labels.pod_name }}
        description: Disk usage on Pod {{ $labels.pod_name }} has exceeded 90% of the volume size.
    - alert: PoC_PodRestarting
      expr: rate(kube_pod_container_status_restarts_total[12s]) > 1
      annotations:
        summary: Pod is Restarting Frequently
        description: Pod {{ $labels.namespace }}/{{ $labels.pod }} has restarted more than once in the last 5 minutes.
