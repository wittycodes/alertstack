apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: custom-alerts-config
  namespace: prometheus
  labels:
    release: poc-stack

spec:
#  global:
#    # ... other global config
  receivers:
  - name: 'airflow_webhook'
    webhookConfigs:
    - url: 'http://poc-stack-webserver.airflow.svc.cluster.local:8080/webhooks/prometheus'

  route:
    receiver: 'airflow_webhook'
#    group_by: [ 'alertname' ]
#    group_wait: 5m
#    group_interval: 5m
#    repeat_interval: 1h
